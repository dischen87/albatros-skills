name: Prüfen
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run pruefen
      - run: npx -y @anthropic-ai/claude-code plugin validate .
