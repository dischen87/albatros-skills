name: Prüfen
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main   # pruefen.ts: Version höher als auf main
      - run: bun run pruefen
      - run: bun test   # scripts/*.test.ts: entwurf-pruefen.mjs gegen die Testseiten gut und schlecht (mit Node aus dem Runner)
      - run: npx -y @anthropic-ai/claude-code plugin validate .
  bausteine:                  # Tests der Rezepte und des Eingangs gegen ein echtes PocketBase (bausteine/README.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2    # wie im Dockerfile des Eingangs
      - uses: actions/cache@v4  # PocketBase in der Version aus dem Dockerfile; programm.ts prüft die Prüfsumme beim Laden
        with:
          path: ~/.cache/albatros-pocketbase
          key: pocketbase-${{ runner.os }}-${{ hashFiles('bausteine/pocketbase/Dockerfile') }}
      - run: bun bausteine/pocketbase/rezepte/buchungen/test.ts
      - run: bun bausteine/pocketbase/rezepte/mitglieder/test.ts
      - run: bun bausteine/eingang/test.ts
  einbau:                     # baut Albatros so ein, wie EINRICHTEN.md es der KI vorgibt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code @openai/codex @google/gemini-cli   # bewusst die neusten: veraltete Befehle sollen auffallen
      - name: Cursor CLI (agent)   # ohne Konto, der Check ruft nur agent mcp login --help auf
        run: curl https://cursor.com/install -fsS | bash && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Einbau in Claude Code, Codex, Gemini CLI und Cursor
        env:
          QUELLE: ${{ github.event_name == 'pull_request' && github.workspace || '' }}   # bei main das echte GitHub-Repo
        run: bash scripts/einbau-test.sh
