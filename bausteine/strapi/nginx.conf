# Die Webseite liest Inhalte unter /cms/api/ und Bilder unter /cms/uploads/, nur lesen (GET).
# Die Verwaltung bleibt draussen, die erreichst du nur über den Tunnel (http://localhost:1337/admin).
location ~ ^/cms/(api|uploads)/ {
  limit_except GET { deny all; }
  resolver 127.0.0.11 valid=10s;
  set $cms http://cms:1337;
  rewrite ^/cms/(.*)$ /$1 break;
  proxy_pass $cms;
  proxy_set_header Host $host;
}

