# Die Webseite reicht /api/ an PocketBase weiter: Login und Formulare laufen über die eigene Adresse.
# Die Verwaltung /_/ bleibt draussen, die erreichst du nur über den Tunnel. Brauchen andere sie ohne Terminal (oder du am Handy),
# gibst du sie frei: die # vor dem Block «Verwaltung freigeben» entfernen. Dann Zwei-Faktor einschalten (Skill bausteine).
location /api/ {
  resolver 127.0.0.11 valid=10s;
  set $pocketbase http://pocketbase:8090;
  proxy_pass $pocketbase;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $http_x_forwarded_for;
  client_max_body_size 10m;
}

