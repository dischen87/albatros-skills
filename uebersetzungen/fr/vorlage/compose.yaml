services:
  webseite:
    container_name: webseite
    build: .
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:                         # « tourne » ne veut pas encore dire « fonctionne »
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      retries: 6

  # L'espace de travail de Bert en ligne : éteint tant que tu ne le veux pas (skill betrieb, « espace de travail sur mon serveur »). L'allumer : docker compose --profile arbeitsplatz up -d
  # Avec ton propre domaine, il répond sous https://arbeitsplatz.<ton-domaine> (nginx.conf transmet le nom), sinon sous
  # https://<name>.aufwind.sh/arbeitsplatz. Seuls les membres de ton projet entrent, connectés avec Albatros. L'adresse et le jeton de ton IA
  # sont dans ~/arbeitsplatz.env sur le serveur, jamais dans le journal de bord.
  arbeitsplatz:
    container_name: arbeitsplatz
    image: ghcr.io/dischen87/albatros-arbeitsplatz:0.3.0   # version de l'espace de travail ; le skill betrieb apporte les plus récentes
    profiles: ["arbeitsplatz"]
    restart: unless-stopped
    init: true
    env_file:
      - path: ../arbeitsplatz.env
        required: false
    environment:
      ARBEITSPLATZ_PORT: "4747"         # port dans le conteneur ; connexion seulement par Albatros
    volumes:
      - ./:/projekt                     # ton projet ; l'IA n'y modifie que ce que sa cage permet (jamais .git/config, .albatros, .claude)
      - arbeitsplatz_heim:/home/arbeitsplatz   # programme d'IA, sa connexion et l'état de l'espace de travail
    expose:
      - "4747"                          # seulement pour nginx dans le site, jamais directement depuis l'extérieur
    mem_limit: 768m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]   # pas plus de droits qu'un programme normal
volumes:
  arbeitsplatz_heim:
