name: Tapis roulant
on:
  push:
    branches: [main]
  workflow_dispatch:                    # bouton « Run workflow » pour lancer un passage à la main

jobs:
  fliessband:
    runs-on: albatros                   # l'ouvrier sur ton propre serveur, il fait une commande après l'autre
    defaults:
      run:
        shell: bash
    env:
      SHA: ${{ github.sha }}
      SEITE: https://${{ github.repository_owner }}.aufwind.sh
    steps:
      - name: Construire et livrer, revenir en arrière si besoin
        run: |
          set -euo pipefail
          cd ~/projekt                  # ici habite ta page, l'état vient toujours du journal de bord
          ALT=$(git rev-parse HEAD)
          git fetch -q origin main && git reset -q --hard "$SHA"
          # Étape 1 : construire. Si ça ne marche pas, l'ancienne page reste en ligne.
          if ! docker compose build; then
            git reset -q --hard "$ALT"
            echo "Construction échouée, l'ancienne page reste en ligne" >&2
            exit 1
          fi
          # Étape 2 : livrer, avec le contrôle de santé de compose.yaml
          sudo systemctl disable --now willkommen 2>/dev/null || true   # la page d'accueil libère le port 80
          if ! docker compose up -d --wait --wait-timeout 300; then
            echo "La nouvelle version n'est pas en bonne santé, retour à $ALT" >&2
            docker compose logs --tail 30 >&2 || true
            git reset -q --hard "$ALT"
            docker compose up -d --build --wait --wait-timeout 300 || true
            exit 1
          fi
          echo "en ligne : $SHA"
      - name: Contrôle final par l'adresse publique
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$SEITE" || true)
            [ "$code" = 200 ] && exit 0
            sleep 3
          done
          echo "$SEITE répond $code au lieu de 200" >&2
          exit 1
