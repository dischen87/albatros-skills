name: Nastro trasportatore
on:
  push:
    branches: [main]
  workflow_dispatch:                    # pulsante «Run workflow» per un giro a mano

jobs:
  fliessband:
    runs-on: albatros                   # l'operaio sul tuo server, fa un incarico dopo l'altro
    defaults:
      run:
        shell: bash
    env:
      SHA: ${{ github.sha }}
      SEITE: https://${{ github.repository_owner }}.aufwind.sh
    steps:
      - name: Costruire e consegnare, se serve tornare indietro
        run: |
          set -euo pipefail
          cd ~/projekt                  # qui abita la tua pagina, lo stato arriva sempre dal diario di bordo
          ALT=$(git rev-parse HEAD)
          git fetch -q origin main && git reset -q --hard "$SHA"
          # Tappa 1: costruire. Se non riesce, la vecchia pagina resta online.
          if ! docker compose build; then
            git reset -q --hard "$ALT"
            echo "Costruzione fallita, la vecchia pagina resta online" >&2
            exit 1
          fi
          # Tappa 2: consegnare, con il controllo di salute di compose.yaml
          sudo systemctl disable --now willkommen 2>/dev/null || true   # la pagina di benvenuto libera la porta 80
          if ! docker compose up -d --wait --wait-timeout 120; then
            echo "La nuova versione non è in salute, ritorno a $ALT" >&2
            docker compose logs --tail 30 >&2 || true
            git reset -q --hard "$ALT"
            docker compose up -d --build --wait --wait-timeout 120 || true
            exit 1
          fi
          echo "online: $SHA"
      - name: Controllo finale dall'indirizzo pubblico
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$SEITE" || true)
            [ "$code" = 200 ] && exit 0
            sleep 3
          done
          echo "$SEITE risponde $code invece di 200" >&2
          exit 1
