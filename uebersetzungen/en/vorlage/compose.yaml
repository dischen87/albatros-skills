services:
  webseite:
    container_name: webseite
    build: .
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:                         # "running" doesn't mean "working" yet
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      retries: 6

  # Bert's workspace online: off until you want it (skill betrieb, "workspace on my server"). Turn it on: docker compose --profile arbeitsplatz up -d
  # With your own domain it answers at https://arbeitsplatz.<your-domain> (nginx.conf passes the name on), otherwise at
  # https://<name>.aufwind.sh/arbeitsplatz. Only members of your project get in, signed in with Albatros. The address and your AI's token
  # are in ~/arbeitsplatz.env on the server, never in the logbook.
  arbeitsplatz:
    container_name: arbeitsplatz
    image: ghcr.io/dischen87/albatros-arbeitsplatz:0.3.0   # workspace version; the skill betrieb brings newer ones
    profiles: ["arbeitsplatz"]
    restart: unless-stopped
    init: true
    env_file:
      - path: ../arbeitsplatz.env
        required: false
    environment:
      ARBEITSPLATZ_PORT: "4747"         # port in the container; sign-in only through Albatros
    volumes:
      - ./:/projekt                     # your project; the AI changes only what its cage allows (never .git/config, .albatros, .claude)
      - arbeitsplatz_heim:/home/arbeitsplatz   # AI program, its sign-in and the workspace's state
    expose:
      - "4747"                          # only for nginx in the website, never directly from outside
    mem_limit: 768m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]   # no rights beyond those of a normal program
volumes:
  arbeitsplatz_heim:
