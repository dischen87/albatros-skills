name: Conveyor belt
on:
  push:
    branches: [main]
  workflow_dispatch:                    # "Run workflow" button for a run by hand

jobs:
  fliessband:
    runs-on: albatros                   # the worker on your own server, it does one job after another
    defaults:
      run:
        shell: bash
    env:
      SHA: ${{ github.sha }}
      SEITE: https://${{ github.repository_owner }}.aufwind.sh
    steps:
      - name: Build and deliver, roll back if needed
        run: |
          set -euo pipefail
          cd ~/projekt                  # your page lives here, the version always comes from the logbook
          ALT=$(git rev-parse HEAD)
          git fetch -q origin main && git reset -q --hard "$SHA"
          # Stage 1: build. If that fails, the old page stays online.
          if ! docker compose build; then
            git reset -q --hard "$ALT"
            echo "Build failed, the old page stays online" >&2
            exit 1
          fi
          # Stage 2: deliver, with the health check from compose.yaml
          sudo systemctl disable --now willkommen 2>/dev/null || true   # welcome page frees port 80
          if ! docker compose up -d --wait --wait-timeout 300; then
            echo "New version is not healthy, back to $ALT" >&2
            docker compose logs --tail 30 >&2 || true
            git reset -q --hard "$ALT"
            docker compose up -d --build --wait --wait-timeout 300 || true
            exit 1
          fi
          echo "running: $SHA"
      - name: Final check via the public address
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$SEITE" || true)
            [ "$code" = 200 ] && exit 0
            sleep 3
          done
          echo "$SEITE answers $code instead of 200" >&2
          exit 1
