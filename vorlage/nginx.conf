server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  include /etc/nginx/bausteine/*/nginx.conf;   # Bausteine wie PocketBase hängen sich hier ein
  location / {
    try_files $uri $uri/ $uri.html =404;
  }
  # Berts Arbeitsplatz online (Dienst arbeitsplatz in compose.yaml, aus, bis du ihn willst): /arbeitsplatz/ geht an den Container, mit dem
  # Namen deiner Seite (Host) und ohne Puffer, damit die Schritte deiner KI sofort ankommen. Läuft er nicht, gibt es die Seite nicht (404).
  # Hat der Arbeitsplatz einen eigenen Namen (unten), nimmt er hier nur noch die Meldungen von Albatros an (neue Mail, Verkauf) und sonst nichts.
  location = /arbeitsplatz {
    return 308 /arbeitsplatz/;
  }
  location /arbeitsplatz/ {
    resolver 127.0.0.11 valid=10s;
    set $arbeitsplatz http://arbeitsplatz:4747;
    proxy_pass $arbeitsplatz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 1h;
    client_max_body_size 2m;
    error_page 502 504 = @arbeitsplatz_aus;
  }
  location @arbeitsplatz_aus {
    return 404;
  }
}

# Berts Arbeitsplatz online unter einem eigenen Namen (arbeitsplatz.<deine-domain>, Skill betrieb): Alles, was unter diesem Namen ankommt, geht an
# den Container. So hat der Arbeitsplatz eine eigene Adresse, und ein Skript auf deiner Webseite kann ihn nicht bedienen, während du angemeldet
# bist. Welche Adresse gilt, steht in ~/arbeitsplatz.env (ARBEITSPLATZ_ADRESSE); unter jeder anderen antwortet der Arbeitsplatz nicht.
server {
  listen 80;
  server_name ~^arbeitsplatz\.;
  location / {
    resolver 127.0.0.11 valid=10s;
    set $arbeitsplatz http://arbeitsplatz:4747;
    proxy_pass $arbeitsplatz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 1h;
    client_max_body_size 2m;
    error_page 502 504 = @arbeitsplatz_aus;
  }
  location @arbeitsplatz_aus {
    return 404;
  }
}
